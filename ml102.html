<script>
window.addEventListener('error', function(e){
  var b=document.createElement('div');
  b.style.cssText='position:fixed;top:10px;left:10px;background:rgba(200,0,0,.92);color:#fff;padding:10px 12px;border-radius:4px;z-index:99999;font-family:monospace;font-size:11px;max-width:90vw;word-break:break-word;user-select:text;-webkit-user-select:text;cursor:text;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.5);';
  var msg=document.createElement('div');
  msg.textContent='Error: '+e.message;
  msg.style.cssText='user-select:text;-webkit-user-select:text;margin-bottom:8px;line-height:1.4;';
  var btn=document.createElement('button');
  btn.textContent='📋 Copy';
  btn.style.cssText='background:#fff;color:#c00;border:none;padding:4px 10px;border-radius:3px;font-family:monospace;font-size:10px;font-weight:600;cursor:pointer;';
  btn.onclick=function(){
    var txt='Error: '+e.message;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        btn.textContent='✓ Copied';
        setTimeout(function(){btn.textContent='📋 Copy';},1500);
      }).catch(function(){fallback(txt,btn);});
    } else {
      fallback(txt,btn);
    }
  };
  function fallback(txt,btn){
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='absolute';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(x){}
    document.body.removeChild(ta);
    btn.textContent='✓ Copied';
    setTimeout(function(){btn.textContent='📋 Copy';},1500);
  }
  b.appendChild(msg);
  b.appendChild(btn);
  document.body.appendChild(b);
});
</script>
