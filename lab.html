<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Lab — Masoud Azizi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--ink:#f0ece4;--amber:#e8b96a;--line:rgba(240,236,228,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.25rem 2rem;display:flex;justify-content:space-between;align-items:center;background:rgba(10,9,8,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.75rem;}
nav a{color:var(--ink);text-decoration:none;}
nav a:hover{color:var(--amber);}
nav .brand span{color:var(--amber);}
#canvas-container{width:100vw;height:100vh;display:block;position:fixed;inset:0;z-index:0;}
.overlay{position:relative;z-index:2;padding:8rem 2rem 3rem;max-width:900px;margin:0 auto;pointer-events:none;}
.overlay h1{font-family:'Instrument Serif',serif;font-size:clamp(2.5rem,6vw,4rem);font-weight:400;letter-spacing:-.02em;margin-bottom:1rem;pointer-events:auto;}
.overlay h1 .italic{font-style:italic;color:var(--amber);}
.overlay .lead{color:#a8a094;max-width:600px;line-height:1.7;pointer-events:auto;margin-bottom:2rem;}
.overlay .controls{pointer-events:auto;display:flex;gap:.75rem;flex-wrap:wrap;}
.overlay .controls a{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.4rem;border:1px solid var(--amber);color:var(--amber);text-decoration:none;border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:.8rem;transition:all .2s;}
.overlay .controls a:hover{background:var(--amber);color:var(--bg);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="brand">MASOUD<span>.</span></a>
  <div><a href="index.html">← Home</a></div>
</nav>

<div id="canvas-container"></div>

<div class="overlay">
  <h1>3D <span class="italic">Lab</span></h1>
  <p class="lead">Procedural experiments in 3D — rendered with Blender + Python, displayed with Three.js.</p>
  <div class="controls">
    <a href="index.html">← Back</a>
    <a href="#" id="toggle-wire">Toggle wireframe</a>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0908');
scene.fog = new THREE.FogExp2('#0a0908', 0.008);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 40, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 20;
controls.maxDistance = 300;

// Lights
scene.add(new THREE.AmbientLight(0x404040, 1));
const sunLight = new THREE.PointLight(0xffeedd, 3, 0, 2);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// Starfield (background)
const starGeo = new THREE.BufferGeometry();
const starCount = 3000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
  const r = 400 + Math.random() * 600;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i+1] = r * Math.cos(phi);
  starPos[i+2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

// Sun
const sunGeo = new THREE.SphereGeometry(8, 64, 64);
const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0xff6600, emissiveIntensity: 1.5 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Planets
const planetsData = [
  { name: 'Mercury', color: 0x8c8c8c, size: 0.8, dist: 14, speed: 1.6 },
  { name: 'Venus', color: 0xe6c28b, size: 1.2, dist: 20, speed: 1.2 },
  { name: 'Earth', color: 0x4a90d9, size: 1.3, dist: 28, speed: 1.0 },
  { name: 'Mars', color: 0xd95c3d, size: 1.0, dist: 36, speed: 0.8 },
  { name: 'Jupiter', color: 0xd9b38c, size: 3.0, dist: 52, speed: 0.5 },
  { name: 'Saturn', color: 0xe0c97a, size: 2.5, dist: 70, speed: 0.35, ring: true },
  { name: 'Uranus', color: 0x7ad9d9, size: 1.8, dist: 88, speed: 0.25 },
  { name: 'Neptune', color: 0x3d5cd9, size: 1.7, dist: 104, speed: 0.18 },
];
const planets = [];
planetsData.forEach(p => {
  const geo = new THREE.SphereGeometry(p.size, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.8, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { dist: p.dist, speed: p.speed, angle: Math.random() * Math.PI * 2, name: p.name };
  scene.add(mesh);
  // Orbit line
  const points = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * p.dist, 0, Math.sin(a) * p.dist));
  }
  const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
  const lineMat = new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.15 });
  scene.add(new THREE.Line(lineGeo, lineMat));
  // Saturn ring
  if (p.ring) {
    const ringGeo = new THREE.RingGeometry(p.size * 1.4, p.size * 2.2, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xe0c97a, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.2;
    mesh.add(ring);
  }
  planets.push(mesh);
});

// Render loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  sun.rotation.y += dt * 0.1;
  planets.forEach(m => {
    m.userData.angle += dt * m.userData.speed * 0.5;
    m.position.x = Math.cos(m.userData.angle) * m.userData.dist;
    m.position.z = Math.sin(m.userData.angle) * m.userData.dist;
    m.rotation.y += dt * 0.5;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Wireframe toggle
let wire = false;
document.getElementById('toggle-wire').addEventListener('click', (e) => {
  e.preventDefault();
  wire = !wire;
  scene.traverse(o => {
    if (o.isMesh && o.material && 'wireframe' in o.material) {
      o.material.wireframe = wire;
    }
  });
});
</script>
</body>
</html>
