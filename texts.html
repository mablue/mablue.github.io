<script>
var TEXTS = [{"title": "There is not a kind atom", "date": "2024-08-01", "text": "Write about a random act of kindness you’ve done for someone. What Do you think about yourself? Are you something more than some atoms? No… You can’t be kind you can’t be awake you can’t be alive and even you can’t be dead. So I didn’t have a kind act for anyone or anthing. If you see me while a kindeness act it’s just an illusion to me and a deception for you."}, {"title": "The world in an abstract view.", "date": "2024-07-26", "text": "After years of thinking about what the world could be in its essence, I came to these three words: difference(disordering), multiplicity, connection. Coupling and cohesion are the results of these three elements. And they create all things and events. If you were a creator in the first moment of the world and you made everything numerous and slightly different or disordered and also capable of being connected or remotely connected, All these events will happen. Increase your marbles to the amount of atoms in the world. And give them the ability to connect with the help of Newton or any quantum forces or rules. And then leave it randomly in space. Over time, you will see marble galaxies. It seems that this world does not need anything extra to become like that."}, {"title": "1) Dubai 2)United States", "date": "2024-07-26", "text": "If you won two free plane tickets, where would you go? You know I am in Iran and I can’t travel to the USA from Iran. So I should first fly to Dubai or Turkey then I’ll fly to the USA. There are good opportunities for writers. And I am writing poems, codes and other philosophic texts. Maybe after a while I can get a USA citizenship and make a verified binance account. To run my crypto trading bots Ideas. I think The world is going to be a good place for cryptocurrency holders. Bitcoin broke the borders and in iran if you have many of these coins you can live in it like a USA citizen…"}, {"title": "I’ll travel to the future in the future!", "date": "2024-07-23", "text": "What are your future travel plans? I want to travel to the future in the future. That Where humanity’s greatest concern is how to endure less pain without resorting to psychedelic drugs and exotic procedures like lobotomy. A world where there is no name of mine, But my ideas in that society have turned into benefits that everyone knows as atomism. That seeks to reduce war, reduce hatred and reduce the seams of every being.Without even seeing the solution in hurting a few other human beings who are against his ideas. See you in the future. I’ll be there like a ghost or alive…"}, {"title": "Prejudices and stereotypes", "date": "2024-07-07", "text": "What could you let go of, for the sake of harmony? I can put aside my prejudices and stereotypes to achieve harmony… Prejudices are the only things that can make people deaf. And stereotypes are the only things that can make people blind. We should know the road and use the best tool to move on it. If we use wheels it’s just usable on a float road. If it is a rocky and dirt road in the forest, the best tools of walking are two feet and two hands. And if it’s a sea lane it will be a boat… So you can’t watch the road and wait for the savior . I should find the most accurate definition to this world as my road and then think for the sake of harmony. Atoms are the most accurate material of this world me and other things. If we have an atomistic life we will have a very good harmony with everything and everyone. Honestly everyone will change to everything in this thinking and it’s own is a very good approval to verification of this idea that everything can work with an strong harmony if we see everything as just accidentally optimized pure atoms."}, {"title": "Returning people to life", "date": "2024-06-07", "text": "Who do you spend the most time with? I chat with bored people some times. It’s an example: … “Dabeat”: So the number 8 doesn’t exist? Masoud: Existentialism says Existed. But in this world nothing existed except atoms and types of connections between them. Also atoms are just the base particles of this world and no one knows are they exactly existed or not its an illusion… It’s called atomism philosophy “Dabeat”: So you think numbers didn’t exist before someone defined them? I think the idea of an 8 has existed in this universe since the beginning of time, humans just discovered it Masoud: When you say existed you should say Who Existed? But when it’s a accidental generation it’s just named For example no one asked you before you born what you want to be and it’s completely an accident you are you. So you cant say you are existed You are not existed you just lefted “Dabeat”: I existed as a possibility before I was born, same with a number, or book or whatever, all those things exists right now because since the beginning of time they were possible, and they existed in an immaterial way Masoud: Everything are Immaterial things also not existed things. “Dabeat”: Well yeah, at some point everything was immaterial besides atoms Masoud: Yes maybe I don’t want to speak on things smaller than atoms. It can be anything or nothing. But there is amazing things are in atoms and atomic thinking. Everything connects together and many stereotypes are disappear also difference between humans and other things all diisappear after that. You will forget your name too if think much to atoms. Also you pay more attention to time to your chances as an stone … Good trade is that you will do someting you will think about that: “Ok if I’m a super lucky stone that can think and see , whats the next job?” This is what happens: First, a person realizes that he is living in a complete illusion, and neither sees, nor thinks, nor enjoys, nor has a name, nor is he human, nor born, nor dies. This person is like molten iron. If he is not on the right path, he will die, his heart will fail because there is no hope left for him. What the terrible cult of nihilism does is to make the world absurd. But this is not my opinion, we have just entered the dark room. This is where I tell Fred what a high chance you had that after billions of years you have become delusional and will soon lose this power. A result that Hindus destroy with the idea of reincarnation and eternal conscious immortality and infinite opportunities. So what’s the plan now, do you want to lose this chance or do you do something worthy of this illusion of luck? Cry For a leak that started to dry completely. Cuz it’s you. It’s maken form atom like you. Cry for all stons that cant breath like you. Cry for your own that you think its a boring life… and than be happy And than do something."}, {"title": "Where is the actual Home?", "date": "2024-05-18", "text": "How do you balance work and home life? Thing that we say to it home. Is just a place for rest. If you make your work like a place for rest. You always in your home! How? 1) find a job that you like 2) make your workstation Comfortable like your home 3) do your job with love And more important and complex step: 4) forget about optimization (about salary and maybe comfort or etc) at first. You should first find the best road for your talents and than start to optimize your productivity than salary than comfort."}, {"title": "وقتی دنبال مقصر میگردید…", "date": "2024-05-18", "text": "وقتی دنبال مقصر میگردید: “شما نباید داستان را از مرحله سوم تعریف کنید بلکه از مراحل اول باید شروع کنید!” یعنی روز حمله حماس به فستیوال یا نه یعنی روز نکبت…امم نه ببخشید اینم درست نیست یعنی از دورانی که موسی دریارو شکافت و این قومش از مصر اومدن طرفای فلسطین یا وایسا اینم نشد روزی که اولین شامپانزه در افریقای جنوبی تصمیم گرفت بره به سمت شمال یا نه این اشتباهه اولین روزی که هابیل قابیل رو کشت یا نه اولین روزی که ادم و هوا به زمین اومدن شایدم در اشتباهم اولین روز روزیه که درون یک غشا اولین دی ان ای تولید شد اولین ملکولی که میتونست خودشو کپی کنه. و شروع کرد به رشد کردن بیشتر و بیشتر شدن جفت گیری قتل و غارت. و فراموش کرد فقط ترکیبی پیچیده از هیدروژن فسفر اکسیژن و کربن بود. مقصر اصلی اشغالگر اصلی مولکول دی ان ای هست چیزی که وحشیانه تاخت به هرچیزی این مولکول رو هرجا دیدین بگیرید اعدامش کنید. موجودی بیجان که توهم زنده بودن دارد و هرچیزی غیر از خودش را تخریب میکند و مدام در تلاش کپی کردن خودش هست. و در مراحلی فکر میکند به خودآگاهی رسیده یا شاید هم باید از حیطه مواد بیرون بیام و مقصر رو در الگوها جستجو کنم. الگوریتم ژنتیک این الگوی تکاملی پیدا کردن جواب مسایل پیچیده…این وحشتناکترین علت تمام پدیده های معاصر چیست؟ شاید هم در ورای این قانون قانونی دیگر نهفته هست آری شاید مقصر واقعی قانونیست که مدام به کوهیژن بها میدهد و از کاپلینگ بیزار است. قانونی که علت انقباض جزئی و انبساط کلی جهان هستی است. آری پاسخ تمام رفتارهایمان همینجاست ما علاقمند به بودن با همتایانمان و دوری جستن از غیر همتایانمان هستیم و مادامی که جامعه آش هزار قماشی از ترکیبها نیست همه چیز وفق مراد است مگر به یک شرط: فراموش کردن تفاوت ها و به خاطر آوردن شباهت های موجود در تمام انسانها… تنها راه نجات بشر امروزیست کلیدواژه‌ها: #اتم‌گرایی‌منطقی"}, {"title": "Atomism: Deferent thinking about life", "date": "2024-05-10", "text": "What public figure do you disagree with the most? When you spend some time believing that everything you see and hear is an atom and atomic components such as photons, neutrons, electrons, and protons, many things lose their meaning. We place less value on things whose components we know because they are less complex. Like a house, baklava, a car or mobile phone, PS5, etc., but when we don’t know what it is like humans, ourselves, our self-awareness, honor, humanity, love and feeling, hate and death and the birth. Eyes and brain and thinking, etc… We attach great importance to the things that are complex to our brains. But by following the idea of atomism, all these are related to the normal states of matter in special conditions. Wait, the story hasn’t started yet: After that, an amazing thing happens, we sit down, think and say that a stone is no different from me, see how lucky I was that I became an apparently self-aware (self-deceiving) atom, but not a stone! And inevitably, you count the greatness of your luck in becoming a human by tapping on your face with your fingers. 🧏🤔 And that’s when you realize you wasted a life by years of working as an employee and reading stupid books for the Ready entrance exam, and how valuable life was, and… in other words, you become the only super crazy person in the family. 😩🎯🥹 And after this stage, you will understand that you are neither born nor will you die, you are just matter that keeps changing until you reach another self-awareness, and you only live times when you can deceive yourself that you have reached self-awareness… This is my different idea about the world and life that I can’t see in other people. — قالب قلبی به دست آورد یک شیرینگری قلبها بسیار دست آورد با قالب گری ساعتی اندیشه باید کرد در این لقمه‌ها واقعی شیرینیان بودند یا طرح و خمی؟ مُسَوّ‌ِت"}, {"title": "Poet, and or a writer", "date": "2024-05-09", "text": "What is your career plan? I am a computer software programmer. But it’s not funny like writing poems and quotes about being and life. I am effective in both writing and programming but I think my first job will be a writer in this world… Cuz I don’t know , people can make some sort of good connections with my words…and sometimes they are really going tierd. 😩 It’s a good job for after die!!"}, {"title": "500km 1week trip with bicycle", "date": "2024-04-29", "text": "Have you ever been camping? Yes I do. I was sent to deprived areas as a soldier teacher. In the summer when it was school vacation, my colleague and I decided to buy a good bike for me too, and hit the road. We left Tabriz and went to the banks of Aras River and came back twice by a different route . Due to slow movement and passing the route from different villages, we covered about 500 kilometers in one week. What I got from this trip was that there were many things to see in East Azerbaijan if we use a bicycle instead of a car. It’s like when the speed is low and you endure a lot of pain to pedal, The space-time plane seem like a stretch for you! And the understanding of the moments becomes much deeper for you. I came back and saw that a very normal week had passed for them who were in Tabriz, but for me it was like a year. Cycling is not a hobby. This is the method that people increase their life span, but this happens very imperceptibly and unconsciously, so that no trace of this phenomenon can be found in any scientific article!🤭 So, Keep calm and cycle. 🚲"}, {"title": "freedom آزادی", "date": "2024-04-29", "text": "آزادی حق داشتن حق است هانا ارنت در جامعه آزاد تقابل حقوق بین افراد مختلف با اندیشه های مختلف هست که قوانین رو شکل میدن. وقتی چیزی رو نمیتونید تعریف کنید یا سخته و پارامترها زیاده بدونید که باید از مسئله یک مشتق بگیرید. مشتق آزادی ( مجموعه کارهایی که حق داریم انجام دهیم) حق داشتن هست D(X²) = 2x #چرتوپرت‌قرن"}, {"title": "All risks I took!", "date": "2024-04-25", "text": "Describe a risk you took that you do not regret. I am an atom set that can make risky decisions. Every atomic set does not have such capabilities. I am a very lucky percentage of the world that accidentally have this ability, I have to celebrate all the risky decisions I made, even though they weren’t the right ones. I suffered a lot because of bad decisions, but I’m sure there are billions of stones in the world who wish to suffer the same pain.They have been waiting for billions of years for the moment when they make a mistake and shoot the ground instead of the ball and their feet are blown. Or ride a bike and skate and slip and get injured. or fail in business, Or fail in a relationship. I believe that our atoms are made to search for the best algorithm in all fields and we are like workers who want the chance to stay in the next stage and enter the next layer if we optimize the current system. Our world is a simple multi threading multi propose optimization system maybe in a Gaming computer in the garage of a house in Mexico…Well, what is your plan in this situation?Do you give birth to many children? or do you try to improve the world one step more like people like Elon Musk?Or just looking for more money for your old age, To prolong your cancer treatment? It’s your chance it’s your choice"}, {"title": "An angel inside the telescope", "date": "2024-04-18", "text": "Describe a random encounter with a stranger that stuck out positively to you. I had not seen anything strange for a long time and tired of everything, I became a member of an NGO astronomy group that held free observation programs at night. that finally, night after night, a strange thing happened. Almost all the girls were usually sleeping in their brother’s arms, except for a relatively large mirror telescope that was gently caressed in the hands of a boy in love with her in the middle of the night to observe the moon and other celestial bodies ready for us, and me and a few other crazy boys who were waiting We were going to see what is happening in space. Finally, we were able to see the moon from a very close distance and I was very amazed, but some of us did not give up. When everyone falls asleep, the night just begins for the curious. We waited again for another adjustment to be made. I would have preferred not to bother the telescope operator with the question of screwing the telescope and ask if there were any questions after the observation… Finally, it was my turn. I stood next to the big mirror telescope and stared into space. Oh no! What is this, an angel with a ring around her head. It’s most magical moment of my life. Yes, my first amazing stranger was the Saturn 🪐. I asked myself at that moment: who are you? The person you see in the mirror? Or any random thing at any random time and place? —— Mirror, mirror on the wall, Tell me now, who do I recall? Is it me, the one staring back? Or any object, in any corner or nook and crack? Am I the image before me, Or a fleeting thought that wanders free? Do I define myself or adapt to the moment, Shifting form like a chameleon, nimble and potent? Who am I, really, in this world of change and flux, Do I stick to my true self or take on varied masks? Perhaps the answer lies in the mirror’s reflection, Revealing fragments of a whole, a kaleidoscopic expression. So look deep within, beyond the outer shell, Discover your essence, your worth, your spell. For you are not just a passing thing at any time or place, But a precious soul, full of grace and infinite space."}, {"title": "Irdians…!", "date": "2024-04-18", "text": "مردم ایران و هندوستان همیشه در پی تروماتیک(دراماتیک) تر جلوه دادن ماجرا هستن. کی قراره از نقش قهرمان های فیلمای بالیوودی درایم و به واقعیت تلخی پا بذاریم که تجربه درام بخشی از فیلمنامه فیلمایی هست که بازیگرهاش گوسفندن و در آرزوی چوپانان بهتر و شرافتمند تر"}, {"title": "ناموس", "date": "2024-04-18", "text": "Bidaryan: درکشور عده ای معتقدند بی ناموس هستند چون با مالکیت القا شده توسط این کلمه مشکل دارند. عده ای دیگر واقعا بی ناموس هستند چون با وحشیگری به دختران مردم حمله میکنند و آنان را در ون می اندازند تا مثلا ارشاد شوند… به این دسته انسانها که به ناموس دیگران تعدی میکنند بی ناموس گفته میشود . Masoud: عده ای هم ناموس رو دو طرفه میدانند و میگویند ناموس چشم من است که هوس بر دیگری نکند. تن من است که بر دیگری عریانی نکند. زبان من است که بر دیگری بلبل زبانی نکند. لکلک های بدبختی که یکی را انتخاب میکنند و در نهایت با همان یا در تنهایی زندگی را به پایان میرسانند. انسان وحشی تر از این است که دو سه یا چهار نخواهد اما نیک بودن توان فرار از زندان تن و یک جهان بینی دگر است. اگر خودی برای خویشتن قائل نشوی دیگری آب کوه جنگل و دشت فرقی با تو برایت نخواهد داشت ته سیگارت را دیگر زمین نخواهی انداخت و دلایل کافی برای عدم انجامش خواهی داشت. و این از خود بیخود شدن یعنی قبول ماهیت اتمی تمام موجودات و پدیده ها‌. وگرنه بله همه لکلک ها میتوانند ضربدری بزنند و خوش باشند. اما باید توجه داشت روابط ضربدری کودکانی با سیم پیچی مغزی معیوب به ارمغان خواهد آورد…"}, {"title": "Earth’s double poles", "date": "2024-04-16", "text": "What place in the world do you never want to visit? Why? I don’t like to see cold places at all, because the lack of heat and the cooling of my body instills in me the fact that I am actually a cold atomic complex… But I was so immersed in my thoughts that I think I am a warm-blooded creature called human. Even though I gave this name and this adjective to myself, I think they are true…"}, {"title": "Hard slap", "date": "2024-04-11", "text": "Describe something you learned in high school. I got a hard slap in school From the school principal. The fact was that we had watched the Neighboring school girls! Yes, this is considered a crime. There are no mixed schools in Iran. After the slap I thought for a long time. I felt a deep pain in myself.I had no pain, it was not because of the slap. I knew very well that I was about to enter a new phase.After that, I remember I was never sad again because of the ridicule and insulting words of my classmates. And this made practically no one talk to me derogatorily anymore. After that I had a certain dignity… special behavior and attitude… I no longer paid attention to ridiculous people and their words. This made me practically respected. I don’t know what was in that slap but I’m sure it helped me wake up. And find out who I am. Many times I received many slaps from life and I stood up and did not give up, and this is the only capital of my life. Get yourself slapped. But don’t directly. do things that you are afraid to do, but they seem right, Make decisions that have high risks… This world is your playground."}, {"title": "Escape from stereotypes", "date": "2024-04-10", "text": "Describe one positive change you have made in your life. Stereotypes are the biggest problem of humanity today. The words that the human mind gives physical existence to and thinks really exist. Human speech is full of words that do not exist in reality, but we were forced to use them to recognize and define events. Like a ruler or Cartesian coordinates with which we explain the position of length, area and volume of things. While such coordinates do not really exist. Some words have settled in our minds like this, such as human, name, birth and death, and self-awareness. If we look at the sight of aimless wandering atoms, which of these is true? None of them !"}, {"title": "Exercise while Profitability", "date": "2024-04-10", "text": "What’s the most fun way to exercise? 1) Planting trees, especially trees that need little water and are resistant. 2) Activities in the Red Crescent and aid organizations. 3) Creating an NGO to show the rings of Saturn to more people in a telescope. The third one was a bit strange, wasn’t it? This was my experience and I knew that we are not alone.It confirmed my not being alone in my subconscious mind. 4) Helping parents with housework can also be useful if we look at it as an exercise."}, {"title": "A beautiful memory in people’s minds", "date": "2024-03-30", "text": "If you could have something named after you, what would it be? The best thing I can have for myself is many things.But is it logical to want or pretend to want things as an atom?No, it’s funny that atomic assemblies have a desire. But they can have an effect. I want to make a positive impact on the environment around me and on the minds of others.A hand that works does not leave money on the other hand and does not ask for anything. He is only working for the survival of the overall system. And practically, one hand does not have the ability to ask for anything, it is just a support, a hook and a versatile wrench and it does its job."}, {"title": "Watching atoms", "date": "2024-03-29", "text": "What makes you laugh? I laugh when I see atoms who think they are really human. They are caught up in their own deception. They consider the contracts they made to understand the world as the reality of their lives. It’s even funnier that they think they are born and die. While they have always been and always will be, only when there is no brain at work, time passes very quickly for them. Close to the speed of light. And oblivion destroys all their previous lives. Of course, I am not a fan of reincarnation. I think we are a combination of substances and minerals which will always be eternal either in the form of matter or in the form of energy…"}, {"title": "I can feel things differently", "date": "2024-03-24", "text": "What’s a secret skill or ability you have or wish you had? There are many people who think they have many problems. I was exactly like them. Until one day something happened to me. I sat down and calculated my chances of being born as a human, as an atom: (all humans atoms count) / (Number of observable universe atoms) = (8×10²⁷) ÷ 10⁸⁰ = 8× 10²⁷-⁸⁰ = 8 × 10-⁵³ In percentage: 8×10-⁵¹%= 0.000000000000000000000000000000000000000000000000008% * The numerator (all humans atoms count) is estimated to be around 8 x 10^27. * The denominator (Number of observable universe atoms) is estimated to be around 10^80. * The division is indeed 8 x 10^27 divided by 10^80, which results in 8 x 10^-53. However, expressing the result as a percentage requires multiplying by 100. So, the final answer would be: 8 x 10^-53 * 100 = 8 x 10^-51% In The decimal form: 0.000000000000000000000000000000000000000000000000008% This value represents an incredibly small percentage, signifying the minuscule fraction of atoms in all humans compared to the observable universe. Also Its just for observable humans and atoms. If I calculate with my first cell and all atoms of universe it can be very smaller than this result! I think we had a very high chance that we took the form of a human. My secret is that I always remember this calculation result…and I am always happy Because of this I’m not any kind of mineral that can’t think cant feel and cant have secret skills… 🙂 New Version Of calculations Click to access atoms-in-humans-probability.pdf"}, {"title": "Favorite weather or favorite fillings?!", "date": "2024-03-23", "text": "What is your favorite type of weather? There is not a different types of weather there is different types of fillings. My favorite filling is that: Understanding that all of these fillings are lie of our minds and being happy in any situations. Its our chance that we can fill things instead other atoms all around us. Feel the intense heat of the air and enjoy it. Feel the extreme cold and enjoy it. Go in a strong storm and feel it right in front of the flood and enjoy it.Feel how the branches scratch your body and you understand. A big part of the world are living without that chance to feel things like you. So fill and love everything and every situation and weather… Enjoy it."}, {"title": "خر سفید", "date": "2024-03-23", "text": "در جهان کافیست من دشمن نباشم باخری تا بهشت جاودان وارد کند مارا زمانی داوری منتظر بر مرگ این ناجی نشستم سالها این شدو سی‌سال ردچون چرخ‌های خاوری بعد عمری دست گرمی با سکوت و انتظار ازمیان گیسوان زالی برامد گفتم آیا کافری؟ جمله فهمیدو سرم در آینه عرعر کشید مردک بیچاره گرخرمن توهمچون قاتری گردنش بگرفتمو از سر برونش ساختم دشمن عمری بگفتا عیب خود را ساتری اوکه تو داری وجود و اندکی هم عمر بود نصف عمرت شعر گفتی تپه‌هایت فاخری چیست آیا نقشه‌‌ات، ریدن به باقیمانده‌اش مانده‌ام گاوی تو آیا، یا هنوزم شاعری قاتلی زنجیره‌ای را با تو برمن فرق نیست تو به قتل عمر و جان خویش هردم حاضری همچو قو در خرمنی اندیشه از رنگ سیه امدم روشن کنم جانا ولی انگار شب را شاکری سالها در عالم زر فکر کردن قفل بود جمله را دانی اگر البته سنگی ماهری مُسَوِّت ۴ فروردین ۱۴۰۳"}, {"title": "Democritus", "date": "2024-03-22", "text": "Who was your most influential teacher? Why? “Sophie’s World” was the book that introduced me to philosophy.With my background from my field of study, “Dr. Izadkhah” introduced me to the genetic algorithm. And mixing of philosophical ideas of “Dariush Shaygan” about human “We are the result of the universe trying to observe itself”, It made me lean towards the Democritus side. In my opinion, in knowing things, we are allowed to break down different things as much as we can.But this work has a limit and we reach the result at some point and there is no need to continue. At the point where we get to the atoms, there is no need for further splitting. At this stage, we become one with the minerals of the world, namely phosphorus, oxygen, hydrogen and carbon. The only thing that is different is the way these atoms are placed together, which makes one diamond and the other coal. Many lessons can be learned from this. How much order do we follow in our work? How far are we going with the program? What is our score in arranging and integrating the things in our office, bedroom and desktop of our personal computer? In short, how organized are our thoughts or what we call the brain? If we can give ourselves a grade in this world, this grade will be exactly equal to our success in life. How do you think it is possible to have a neat and orderly personality and thoughts? Maulavi (Maulana Jalaluddin Balkhi) answers the question. Man has several personalities: 1) What we really are. 2) The person we think we are. 3) The character that others think we have. 5) The personality that we think others know us. 6) The character that others think we think we are. 7) The character we want to leave behind in the minds of others. … Molvi says tell me how much your other characters are equal to the first and second characters so that I can tell how much your mind is involved in different issues. According to Democritus, the best situation is that all our characters are similar to the first option. In this state, we have no fear. In this state, we will have the best and most orderly state of thoughts. These were the summaries of people and information that I learned from the best coaches in my life."}, {"title": "Stop confusing atoms", "date": "2024-03-21", "text": "What tattoo do you want and where would you put it? Stop confusing atoms tattoo I will put it on my right hand…"}, {"title": "Atomistic Life Manner", "date": "2024-03-21", "text": "What do you wish you could do more every day? I like to do something that makes me feel happy when I’m about to die. The things that come from my ego are not from my atomistic worldview and the ways that can help to increase the vision of this atom. To see and know himself better, and persecute himself less. I want to be a window of hope for children and a bulldozer to destroy the old mind. The world means us, we mean the world. None of us chose to be us. Maybe the real us is that people that are under fire somewhere. Or maybe the real us is a lake that drying up. Or stray puppies that are killed by bullets. To be driven out of town. No one asks us before our birth what or who we want to be born. Are we born and die at all? I have a lot of doubts about this too. I want to stop confusing more atoms with religions, egos, cultures, borders, nationalities, languages, and colors. Please stop confusing atoms."}, {"title": "شبح آشنا", "date": "2024-03-19", "text": "عالَمی دیدم که عالِم شد به خویش دیگری خواندش توالی‌های خویش گفتمش هان‌ ای اتم فخرت به چیست؟ موی را ناخن نمی‌شاید بزخماند به‌نیش اینچنین باشد عجب پاسخ بگفتش، گوییا عاقلان دانند هر جِن‌بنده‌ را عضوی زخویش باک گر از این نداری ذره نامی همّه را شرح ده اِسپین افلاطون خویش 🤔 مُسَوّ‌ِت ۲۹ اسفند ۱۴۰۲"}, {"title": "ناگریز!", "date": "2023-07-21", "text": "روزگاری نیوتون آمدو گفت بین خورشید و زمین جاذبه هست این دو با هم خنثی عشق و دعوا دارند این سخن دید انیشتین و به فکرش افتاد گر به یک پارچه من بندازم گوی سنگین چو فلک همه افلاک چه سردو دمغ و خالی از عشق ناگزیرند به هنگام عبور دور آن خیکی لامبورگ سوار حداقل یک شب بی بند و بار همچو پروانه یکی دور زنند مُسَوّ‌ِت"}, {"title": "پی‌غم‌بر", "date": "2023-07-21", "text": "برترین نوع پیام لخت و عریان شدن است آسمان گفت مرا این گونه و همانطور که خورشیدِ خودش میپوشید گفت هر شب اینطور من به بالین تو هم می‌آیم مشکل گوش تو خوش‌خوابی هست نازمش چشم شبان شب صحرایی دور تاکه با مردمکی باز تواند که بدوزد سمتم مُسَوّ‌ِت"}, {"title": "وحی", "date": "2023-07-21", "text": "برو ک‍‍ف‍‍ر خود ورزو شع‍رت بگوی که از غیب جز شع‍ر ناید نگوی وزین شعر گویی ولی از شکم زین پس مخاطب نجوی که مجن‍ون اگر شد یکی کعبه رفت بپرسش که با عشق یا بر چه رفت که گر قصد، لیلی و مقصد دل است ره کعبه و می‌کده هَمگِن است مُسَوّ‌ِت"}, {"title": "انتزاع", "date": "2023-07-21", "text": "قصاب زهم گسسته قوچ‌ها را دید از غوضرف نرم برّه‌ها را برّید کسری که یک عمر بهر جامش جنگید کاهی به کَخ‌اش چو کَهفشان می‌غرّید مُسَوّ‌ِت 1444/12/15"}, {"title": "جبر", "date": "2023-07-21", "text": "ماه در بیغوله با اذن خودش راهی نگشت از نداری‌های تاریکی به کنجی برنشست آنکه عمری هیچ اسبی را به افساری نبست همنشینی با نباید ها چنینش ساخت ست راز احوال هرگز از طیار و عیّاران نپرس ظن ندارم آمدوشد این چنین رخ داده است چون که طیار از نداری عاشق افسار هست وانکه ثروت یا مقام امروز نام عیّار هست وانکه طیاری کند تنها خوشی دیوانگیست گنده لاتی کردن هم در پیشه ی عیار هست گشت حالا بر تو راز این دو موجود آشکار؟ ذوق احوالات ناجور این دورا خربار هست. مُسَوّ‌ِت‌ ۱۳۹۷/۱۰/۸"}, {"title": "اوپلاس", "date": "2023-07-21", "text": "بنشین که از بلخ آمدی ترشیده و تلخ آمدی جام شرابت را بگیر از وادی درد آمدی با بقچه‌ای پر از کتاب از فرقه‌ی اگزیستنس رندی و پر از نغمه‌ای از باب کثرت آمدی آگاه بر خود آمدی آیینه بر کتف آمدی او میشناسد تورا پاشو خودت را جوی از او گر نامدی پاسخ از او شاید به جلفا آمدی مُسَوّ‌ِت باتشکر از استاد گرانقدر اوپلاس از جلفا جهت رد گم کنی(احتمالا سیاوش از مرند😂)"}, {"title": "سفالگر", "date": "2023-07-21", "text": "درون هر انار سرخ صدها دانه هست یکی ترش و یکی شیرین زدودن مشکل است برای بنده شاید باشد فخاری و مطلق جوهری ولی سازنده‌ از دید خودش صورتگر است درون هر انار سرخ، صدها دانه همچون خواهر هست یکی ترش و یکی شیرین، سفیدش شوکر هست به طرح ظرف چینی فخر بر رعیت فروشد کوزه گر ولی فخار ماهر در نگاه خویش نی صورتگر است؟ مُسَوّ‌ِت مُسَوّ‌ِت"}, {"title": "گوشت", "date": "2023-07-21", "text": "صورتی هستم ولی با ظاهری رنگین کمان جوهری وارسته از‌ قانون، شرط‌ و امتحان آرمان دارم واین بیراهه با چشمان کورم میروم نیست بر چشمان من سویی شکافم قفل جان مُسَوّ‌ِت"}, {"title": "کفتر‌ حرم 🕊️", "date": "2023-07-21", "text": "در حلقه دین و مصطفایم؟هرگز از جمع کران و جمکرانم؟ هرگز کفتر به حرم ولی چنین می‌نالد گندم خوره گنبدش برینم؟ هرگز مُسوّ‌ِت ۱۴۴۴/۱۲/۲۷"}, {"title": "حمام فین!", "date": "2023-07-21", "text": "هر شخص به نوبت خودش خم کرده از ترس جبین شکن، جبینش کرده هر کس که بگوفت نه بگو اجدادش چرکین شده دوشْ، فین زیارت کرده مُسوّ‌ِت ۱۴۴۴/۱۲/۲۷"}, {"title": "عاقبت شیران", "date": "2023-07-21", "text": "شیران همه در جنگ مغیلان مردند اسپرم نگشته در جنین پژمردند اینها که به دشت خشک آبی باقیست از شمر و علی و خایه داران خوردند مُسوّ‌ِت ۱۴۴۴/۱۲/۲۷"}, {"title": "ناخدای زیرک", "date": "2023-07-21", "text": "گرام من ناخدا بودم بدین کان، بسی مادرخطا زیرک طلادان. میاوردم قوانینی و آیینی خیالی، ومیگفتم کنی باور دهم جان عطا میکردم‌اش از قدرت فکر، بهشتی لایق خوش کفر ورزان و آنهایی که رفتندر عبادت، فرو میکردم آنها در فروزان مُسَوّ‌ِت ۱۰۴۲/۴/۲۷"}, {"title": "دغدغه‌ها…", "date": "2023-07-21", "text": "یکی در فکر اینترفی‌سبی‌الله، دوشنبه باز آمد آخر ماه یکی می‌پرسد آیاری رسان نیست؟، همانا ماتمی دارد بدین ماه خسارت بیمه تا ۵۰ پرداخت، سعادت بچه زایید آخر ماه و پیمانی که کرده ذهن درگیر، همانا شاید آمد آخرین ماه مراد از زندگانی چیست یاران؟، واشارم سوخت بابا آخر ماه تصادف بیمه روغن لنت لاستیک، چراغ چک زند چشمک به‌من‌آه و کارتی که بگفتن دَه کنیمش، زدندش جمع اما آخر ماه! مُسَوّ‌ِت ۱۴۰۲/۴/۲۶"}, {"title": "Immortality", "date": "2023-07-21", "text": "I see birth of another alien in your death,another planet,other solar system,after million yeras and maybe after many continuous bigbanges. As a plant or animal does not matter.the only thing is matter that You will not understand the passage of time between shifts…"}];
