<script>
window.addEventListener('error', function(e){
  var b=document.createElement('div');
  b.style.cssText='position:fixed;top:10px;left:10px;background:rgba(200,0,0,.92);color:#fff;padding:10px 12px;border-radius:4px;z-index:99999;font-family:monospace;font-size:11px;max-width:90vw;word-break:break-word;user-select:text;-webkit-user-select:text;cursor:text;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.5);';
  var msg=document.createElement('div');
  msg.textContent='Error: '+e.message;
  msg.style.cssText='user-select:text;-webkit-user-select:text;margin-bottom:8px;line-height:1.4;';
  var btn=document.createElement('button');
  btn.textContent='📋 Copy';
  btn.style.cssText='background:#fff;color:#c00;border:none;padding:4px 10px;border-radius:3px;font-family:monospace;font-size:10px;font-weight:600;cursor:pointer;';
  btn.onclick=function(){
    var txt='Error: '+e.message;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        btn.textContent='✓ Copied';
        setTimeout(function(){btn.textContent='📋 Copy';},1500);
      }).catch(function(){fallback(txt,btn);});
    } else {
      fallback(txt,btn);
    }
  };
  function fallback(txt,btn){
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='absolute';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(x){}
    document.body.removeChild(ta);
    btn.textContent='✓ Copied';
    setTimeout(function(){btn.textContent='📋 Copy';},1500);
  }
  b.appendChild(msg);
  b.appendChild(btn);
  document.body.appendChild(b);
});
</script>

<script>
(function(){
  var ERRORS=[];
  window.addEventListener('error',function(e){ERRORS.push('ERR: '+e.message+' @ '+((e.filename||'').split('/').pop())+':'+e.lineno);refresh()});
  window.addEventListener('unhandledrejection',function(e){ERRORS.push('REJ: '+((e.reason&&e.reason.message)||e.reason));refresh()});
  var audioHook=null;
  var OA=window.Audio;
  window.Audio=function(s){var a=new OA(s);if(!audioHook)audioHook=a;return a};
  window.Audio.prototype=OA.prototype;
  function refresh(){
    var info=[];
    info.push('=== DIAG '+new Date().toLocaleTimeString()+' ===');
    info.push('path: '+location.pathname);
    info.push('readyState: '+document.readyState);
    info.push('');
    info.push('canvas:       '+(document.querySelector('canvas')?'✓':'✗'));
    info.push('controls:     '+(document.querySelector('.controls')?'✓':'✗'));
    info.push('subtitle-bar: '+(document.querySelector('.subtitle-bar')?'✓':'✗'));
    info.push('#sub-text:    '+(document.querySelector('#sub-text')?'✓':'✗'));
    info.push('#play-btn:    '+(document.querySelector('#play-btn')?'✓':'✗'));
    info.push('total btns:   '+document.querySelectorAll('button').length);
    info.push('audio el:     '+(audioHook?'✓ (hooked)':(document.querySelector('audio')?'✓ (in DOM)':'✗')));
    if(audioHook){
      info.push('');
      info.push('src:      '+(audioHook.src||'(empty)'));
      info.push('paused:   '+audioHook.paused);
      info.push('ready:    '+audioHook.readyState);
      info.push('time:     '+audioHook.currentTime.toFixed(2));
      info.push('duration: '+(audioHook.duration||0).toFixed(2));
    }
    info.push('');
    info.push('errors: '+ERRORS.length);
    if(ERRORS.length){info.push('---');ERRORS.forEach(function(e){info.push(e)})}
    var p=document.getElementById('dpanel');
    if(!p){
      p=document.createElement('div');p.id='dpanel';
      p.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:#000f;color:#0f0;font-family:monospace;font-size:13px;padding:12px;z-index:2147483647;overflow:auto;white-space:pre-wrap;line-height:1.55';
      p.onclick=function(){p.remove()};
      document.body.appendChild(p);
    }
    p.textContent=info.join('\n')+'\n\n[tap to dismiss]';
  }
  [800,1500,2500,4000].forEach(function(t){setTimeout(refresh,t)});
})();
</script>
